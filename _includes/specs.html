<!-- Tech specs section -->
<section class="specs notebook-bg" id="specs">
  <div class="container-inner">
    <span class="section-tag">Tech specs</span>
    <h2 class="sec">Stack &amp; capabilities</h2>
    <p class="sec-sub">At-a-glance — the kind of table Reachy uses for dimensions</p>
    <div class="specs-grid">
      <div class="specs-col">
        {% for spec in site.data.specs limit: 4 %}
        <div class="spec-row">
          <span class="k">{{ spec.key }}</span>
          <span>{{ spec.value }}</span>
        </div>
        {% endfor %}
      </div>
      <div class="specs-col">
        {% for spec in site.data.specs offset: 4 %}
        <div class="spec-row">
          <span class="k">{{ spec.key }}</span>
          <span>{{ spec.value }}</span>
        </div>
        {% endfor %}
      </div>
    </div>
  </div>
</section>
