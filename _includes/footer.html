<footer class="site-footer">
  <span class="footer-copy">© {{ site.title }} {{ 'now' | date: "%Y" }}</span>
  <div class="footer-links">
    {% for network in site.social %}
    <a href="{{ network.url }}" target="_blank" rel="noopener">{{ network.title | capitalize }}</a>
    {% endfor %}
    <a href="mailto:{{ site.email }}">Email</a>
  </div>
</footer>
